name: Publish NuGet packages

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Verify release tag
        id: release
        shell: bash
        run: |
          version="$(python3 eng/version.py get)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected release tag 'v$version', got '$GITHUB_REF_NAME'." >&2
            exit 2
          fi
          python3 eng/version.py verify
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test version tooling
        run: python3 -m unittest discover -s eng/tests -v

      - name: Build
        run: dotnet build Quantitas.slnx -c Release -warnaserror

      - name: Run tests
        run: dotnet test Quantitas.slnx -c Release --no-build --no-restore

      - name: Pack
        run: dotnet pack Quantitas.slnx -c Release --no-build

      - name: Check package versions
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for id in Quantitas Quantitas.Analyzers; do
            if [[ ! -f "artifacts/packages/$id.$VERSION.nupkg" ]]; then
              echo "Missing artifacts/packages/$id.$VERSION.nupkg." >&2
              exit 2
            fi
          done
          count="$(find artifacts/packages -name '*.nupkg' | wc -l)"
          if [[ "$count" -ne 2 ]]; then
            echo "Expected 2 packages, found $count." >&2
            exit 2
          fi

      - name: Upload reviewed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: artifacts/packages/
          if-no-files-found: error

  publish:
    environment: nuget-release
    name: Publish v${{ needs.build.outputs.version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Download reviewed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Confirm NuGet publisher is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "Repository variable NUGET_USER must contain the trusted-publishing account name." >&2
            exit 2
          fi

      - name: Request temporary NuGet credential
        id: nuget-login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # Quantitas.Analyzers has no .snupkg; push on a *.nupkg glob also uploads a sibling .snupkg
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done
